<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ตรวจสอบ PDF</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Segoe UI,sans-serif;background:#333;color:#fff}body{display:flex;flex-direction:column}header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#404040}input{width:60px}button,input{padding:5px}#pages{flex:1;overflow:auto;min-height:0;padding:12px}.page{margin:0 auto 12px;background:white;box-shadow:0 2px 8px #111;position:relative}.page canvas{display:block;width:100%;height:100%}#status{font-size:12px}
header{flex-wrap:wrap}.view-switch{display:flex;gap:3px;padding:3px;border-radius:7px;background:#292929}.view-switch button{border:0;border-radius:5px;background:transparent;color:#eee;padding:6px 10px;cursor:pointer}.view-switch button[aria-pressed="true"]{background:#f5f8fc;color:#174e8c;font-weight:700}#pages.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;align-content:start}.grid .page{width:100%!important;height:auto!important;margin:0;cursor:pointer;border:3px solid transparent;box-shadow:0 2px 8px #111}.grid .page:hover,.grid .page:focus-visible{border-color:#6eaefa;outline:0}.grid .page[aria-current="page"]{border-color:#2d83eb}.grid .page::after{content:'หน้า ' attr(data-page);display:block;padding:7px;background:#fff;color:#31465e;font-weight:700;font-size:13px}.grid .page canvas{height:auto}#gridHelp{color:#e5edf6;font-size:12px}#gridHelp[hidden]{display:none}
</style>
<script src="../js/pdf.min.js"></script>
</head>
<body>
<header><button id="prev" aria-label="หน้าก่อนหน้า">◀</button><input id="number" type="number" min="1" value="1" aria-label="เลขหน้า"><span id="total"></span><button id="next" aria-label="หน้าถัดไป">▶</button><button id="out" aria-label="ย่อ">−</button><button id="in" aria-label="ขยาย">+</button><div class="view-switch" role="group" aria-label="รูปแบบการดู PDF"><button type="button" id="singleView" aria-pressed="true">▣ หน้าเดียว</button><button type="button" id="gridView" aria-pressed="false">▦ หลายหน้า</button></div><span id="gridHelp" hidden>เลือกหน้าเพื่อเปิดตรวจสอบ</span><span id="status">กำลังโหลด PDF...</span></header>
<main id="pages"></main>
<script src="review-pdf-viewer.js?v=20261105-grid"></script>
</body>
</html>
